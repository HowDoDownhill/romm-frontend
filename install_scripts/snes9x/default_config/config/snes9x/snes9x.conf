# snes9x-gtk configuration (Linux only).
#
# The GTK frontend has no portable mode: get_config_dir() in gtk/src/gtk_config.cpp
# resolves $XDG_CONFIG_HOME, else $HOME/.config/snes9x. meta.json therefore sets
# XDG_CONFIG_HOME to <emulator dir>/config via launch_env, which lands this file at
# <emulator dir>/config/snes9x/snes9x.conf.
#
# The Windows build does NOT read this file — it is portable already (S9xGetDirectory
# in win32/win32.cpp uses GetModuleFileName, i.e. the exe's own directory) and defaults
# Dir:SRAM to ".\Saves". "Saves" is capitalised here to match that Windows default so a
# single relative_save_path entry covers both platforms.
#
# Left unset, S9xGetDirectory (gtk/src/gtk_file.cpp) falls back to the ROM's own folder,
# putting saves in the roms directory where save sync cannot see them.

[Files]
SRAMDirectory = Saves
SaveStateDirectory = Saves

[Display]
FullscreenOnOpen = 1
MaintainAspectRatio = 1
ScaleToFit = 1
