# snes9x configuration (Windows only).
#
# The Windows build is portable: S9xGetDirectory in win32/win32.cpp resolves paths
# from GetModuleFileName, i.e. the exe's own directory, so this file must sit next
# to snes9x-x64.exe. It does NOT read config/snes9x/snes9x.conf — that path is the
# GTK build's XDG location and is shipped separately for Linux.
#
# Only the keys below are set; snes9x registers defaults for everything else and
# rewrites the file in full on exit, so this is a first-run seed rather than a
# complete config. Saves need no entry here: the Windows default for Dir:SRAM is
# already ".\Saves", which matches relative_save_path in meta.json.
#
# Binding format:
#   (J1)          joystick 1 — ONE-indexed, unlike every other emulator here
#   Button N      raw SDL/DirectInput button index. For XInput pads:
#                 0=A 1=B 2=X 3=Y 4=LB 5=RB 6=Back 7=Start 8=LStick 9=RStick
#   POV <dir>     d-pad hat. Diagonals abbreviate down as "Dn" (POV Dn Right).
#
# Face buttons follow the positional convention (see docs/controller-followups.md).
# The SNES pad is X top, Y left, A right, B bottom — so SNES A maps to the Xbox
# pad's right button (index 1) and SNES B to its bottom button (index 0). This
# keeps the physical layout intact and matches how mGBA and melonDS are shipped.
#
# Joypad2 is deliberately left on its keyboard defaults: a second SNES player would
# be (J2), but that is untested and would silently break single-pad users if the
# index were wrong.

[Controls\Win]
Joypad1:Enabled    = TRUE
Joypad1:Up         = (J1)POV Up
Joypad1:Down       = (J1)POV Down
Joypad1:Left       = (J1)POV Left
Joypad1:Right      = (J1)POV Right
Joypad1:Left+Up    = (J1)POV Up Left
Joypad1:Right+Up   = (J1)POV Up Right
Joypad1:Right+Down = (J1)POV Dn Right
Joypad1:Left+Down  = (J1)POV Dn Left
Joypad1:A          = (J1)Button 1
Joypad1:B          = (J1)Button 0
Joypad1:X          = (J1)Button 3
Joypad1:Y          = (J1)Button 2
Joypad1:L          = (J1)Button 4
Joypad1:R          = (J1)Button 5
Joypad1:Start      = (J1)Button 7
Joypad1:Select     = (J1)Button 6
