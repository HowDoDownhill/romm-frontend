# Wii Remote sources. Verified against Core/Config/WiimoteSettings.cpp and
# Core/HW/Wiimote.h:
#
#   Source: 0 = None, 1 = Emulated, 2 = Real
#
# Dolphin's own default is Wiimote1 = Emulated (1). We deliberately override to
# Real (2) for all four ports: this frontend does not ship emulated Wii Remote
# bindings, so leaving the default would give the user a Wii Remote that appears
# connected but responds to nothing.
#
# Real Wii Remotes connect over Bluetooth. Pair by pressing 1+2 (or the red sync
# button) while a game is running — Dolphin.ini sets WiimoteContinuousScanning so
# this works without opening any menus.
#
# BalanceBoard is left at None; enable it (Source = 2) if using a Wii Balance Board.

[Wiimote1]
Source = 2

[Wiimote2]
Source = 2

[Wiimote3]
Source = 2

[Wiimote4]
Source = 2

[BalanceBoard]
Source = 0
