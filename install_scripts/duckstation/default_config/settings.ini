[Main]
SetupWizardIncomplete = false
ConfirmPowerOff = false
PauseOnFocusLoss = false
InhibitScreensaver = true
SaveStateOnExit = false

[BIOS]
SearchDirectory = bios
PatchFastBoot = true

[GPU]
Renderer = Automatic
ResolutionScale = 1
Multisamples = 1
UseDebugDevice = false
DisableShaderCache = false
PGXPEnable = false
TextureFilter = Nearest

[Display]
AspectRatio = Auto (Game Native)
CropMode = Overscan
VSync = false
ShowOSDMessages = true
ShowFPS = false
ShowSpeed = false
ShowResolution = false

[MemoryCards]
Card1Type = PerGameTitle
Card2Type = None
UsePlaylistTitle = true
Directory = memcards

[ControllerPorts]
MultitapMode = Disabled
PointerXScale = 8
PointerYScale = 8

[InputSources]
Keyboard = true
Mouse = true
SDL = true
SDLControllerEnhancedMode = false
XInput = false
DInput = false

[Pad1]
Type = AnalogController
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/FaceNorth
Circle = SDL-0/FaceEast
Cross = SDL-0/FaceSouth
Square = SDL-0/FaceWest
Select = SDL-0/Back
Start = SDL-0/Start
Analog = SDL-0/Guide
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LUp = SDL-0/-LeftY
LDown = SDL-0/+LeftY
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
RUp = SDL-0/-RightY
RDown = SDL-0/+RightY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
LargeMotor = SDL-0/LargeMotor
SmallMotor = SDL-0/SmallMotor

[Pad2]
Type = None

[Hotkeys]
FastForward = Keyboard/Tab
TogglePause = SDL-0/Back & SDL-0/FaceSouth
PowerOff = SDL-0/Back & SDL-0/Start
Screenshot = Keyboard/F10
OpenPauseMenu = SDL-0/Start & SDL-0/LeftStick
ToggleFullscreen = SDL-0/Back & SDL-0/RightStick
LoadSelectedSaveState = SDL-0/Back & SDL-0/LeftShoulder
SaveSelectedSaveState = SDL-0/Back & SDL-0/RightShoulder
